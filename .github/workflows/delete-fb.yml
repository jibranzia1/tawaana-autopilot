name: Delete Facebook posts

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Queue item ids to delete from the Facebook Page, comma separated"
        required: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Delete
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IDS: ${{ github.event.inputs.ids }}
        run: python scripts/delete_fb.py "$IDS"
      - name: Save log
        if: always()
        run: |
          git config user.name "tawaana-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add log/published.json
          git diff --cached --quiet && exit 0
          git commit -m "Deleted Facebook posts: $IDS"
          git pull --rebase --quiet && git push
        env:
          IDS: ${{ github.event.inputs.ids }}
