name: Validate queue

on:
  pull_request:
    paths: ["queue/**", "docs/media/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow && (which ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg))
      - run: python scripts/validate.py
