name: Publish daily post

# All times Pakistan (UTC+5). GitHub may start scheduled runs a few minutes late.
#   07:52 UTC = 12:52 PM  midday story
#   14:47 UTC =  7:47 PM  feed post (Reel / carousel / static)
#   15:07 UTC =  8:07 PM  evening story (today's post, repurposed)
on:
  schedule:
    - cron: "52 7 * * *"
    - cron: "47 14 * * *"
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "What to publish"
        type: choice
        options: [feed post, midday story, evening story]
        default: feed post
      post_id:
        description: "Force-publish one post or story id (leave empty for today's)"
        required: false
      dry_run:
        description: "Check only, do not post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publish
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          KIND: ${{ github.event.inputs.kind }}
        run: |
          ARGS=""
          if [ "$SCHEDULE" = "52 7 * * *" ] || [ "$KIND" = "midday story" ]; then ARGS="--stories midday"; fi
          if [ "$SCHEDULE" = "7 15 * * *" ] || [ "$KIND" = "evening story" ]; then ARGS="--stories evening"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.post_id }}" ]; then ARGS="$ARGS --post-id ${{ github.event.inputs.post_id }}"; fi
          python scripts/publish.py $ARGS

      - name: Save publish log
        if: always()
        run: |
          git config user.name "tawaana-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add log/published.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Publish log $(TZ=Asia/Karachi date '+%F %H:%M')"
          git pull --rebase --quiet && git push
