name: Publish daily post

# Runs every 15 minutes from 12:05 PM to 9:50 PM Pakistan time (UTC+5) and posts whatever
# is due and not posted yet: midday story from 12:50 PM, feed post from its "time" (7:30 PM),
# evening story from 8:05 PM. GitHub sometimes delays or drops scheduled runs; the next
# run simply catches up. log/published.json stops anything posting twice.
on:
  schedule:
    - cron: "5,20,35,50 7-16 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "What to publish"
        type: choice
        options: [anything due now, feed post, midday story, evening story]
        default: anything due now
      post_id:
        description: "Force-publish one post or story id (leave empty for today's)"
        required: false
      dry_run:
        description: "Check only, do not post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Publish
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          KIND: ${{ github.event.inputs.kind }}
        run: |
          ARGS="--auto"
          if [ "$KIND" = "feed post" ]; then ARGS=""; fi
          if [ "$KIND" = "midday story" ]; then ARGS="--stories midday"; fi
          if [ "$KIND" = "evening story" ]; then ARGS="--stories evening"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.post_id }}" ]; then ARGS="$ARGS --post-id ${{ github.event.inputs.post_id }}"; fi
          python scripts/publish.py $ARGS

      - name: Save publish log
        if: always()
        run: |
          git config user.name "tawaana-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add log/published.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Publish log $(TZ=Asia/Karachi date '+%F %H:%M')"
          git pull --rebase --quiet && git push
